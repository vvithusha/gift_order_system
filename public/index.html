<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gift Shop</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"></header>
<main>
  <section class="hero"><div><h1>Because Every Gift<br>Tells a Story...</h1>
    <p>Personalized gifts for birthdays, anniversaries, celebrations and more!</p>
    <a class="btn" href="#products">Shop Now</a></div><div class="art">🎁</div></section>
  <h2 class="sec" id="products">♥ Our Gift Collection</h2>
  <div class="grid" id="grid"><div class="empty">Loading gifts…</div></div>
  <div class="perks"><span>🚚 Free Delivery (selected areas)</span><span>🛡️ Secure Payment</span><span>♥ Quality Products</span></div>
</main>
<script src="/app.js"></script>
<script>
renderHeader("home");
api("/api/products").then(list => {
  document.getElementById("grid").innerHTML = list.length ? list.map(p => `
    <div class="card"><div class="thumb">${esc(p.emoji)}</div><h4>${esc(p.name)}</h4>
    <div class="price">${rs(p.price)}</div><a class="btn sm" style="display:block;text-align:center" href="/order.html?id=${p.id}">Select</a></div>`).join("")
    : '<div class="empty">No gifts available right now.</div>';
}).catch(() => document.getElementById("grid").innerHTML = '<div class="empty">Could not load gifts.</div>');
</script></body></html>
